name: Bug Report
description: Report a bug to help us improve metacubexd
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

        **Do NOT include tokens, subscription URLs, profile contents, private keys, or credentials.**

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Type
      description: How are you running metacubexd?
      options:
        - Hosted Panel (official sites or self-hosted static)
        - Desktop App (Electron)
        - All-in-One Server (Docker)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of metacubexd you are using (check the footer or release tag)
      placeholder: e.g. 1.270.4
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Windows (arm64)
        - Linux (x64)
        - Linux (arm64)
        - Docker / Container
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if applicable)
      description: For hosted panel or server dashboard issues
      placeholder: e.g. Chrome 126, Safari 18, Firefox 128

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: |
        Paste relevant logs, console errors, or attach screenshots.
        **Remove any secrets, tokens, or personal information before pasting.**

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (mihomo version, network setup, etc.)

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and this bug has not been reported before.
          required: true
        - label: I am using the latest version of metacubexd.
          required: false
        - label: I have removed all sensitive information from this report.
          required: true
